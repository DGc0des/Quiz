<svg viewBox="0 0 130 130" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- ground shadow -->
  <ellipse cx="65" cy="120" rx="46" ry="3.8" fill="rgba(0,0,0,0.22)"/>

  <!-- loaf-shaped body -->
  <path d="M 18 60 C 18 42, 30 30, 50 28 C 64 26, 82 28, 96 32 C 110 38, 116 52, 116 70 C 116 92, 104 110, 80 114 C 56 116, 32 114, 22 102 C 14 90, 12 76, 18 60 Z" fill="#D4A47A" stroke="#5A3A22" stroke-width="3" stroke-linejoin="round"/>

  <!-- belly lighter wash -->
  <ellipse cx="64" cy="92" rx="40" ry="18" fill="#E5BC92" opacity="0.55"/>

  <!-- fur tufts — left edge -->
  <g stroke="#5A3A22" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M16 56 q -2 2 -1 5"/>
    <path d="M14 66 q -2 2 -1 5"/>
    <path d="M14 78 q -2 2 -1 5"/>
    <path d="M16 90 q -2 2 -1 5"/>
    <path d="M22 102 q -2 2 -1 4"/>
  </g>

  <!-- fur tufts — bottom edge -->
  <g stroke="#5A3A22" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M30 114 l 1 4"/>
    <path d="M44 116 l 1 4"/>
    <path d="M62 117 l 1 4"/>
    <path d="M82 116 l 1 4"/>
    <path d="M100 112 l 2 4"/>
  </g>

  <!-- interior fur dashes -->
  <g stroke="#5A3A22" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4">
    <line x1="36" y1="60" x2="36" y2="64"/>
    <line x1="46" y1="80" x2="46" y2="84"/>
    <line x1="30" y1="86" x2="30" y2="90"/>
    <line x1="60" y1="98" x2="60" y2="102"/>
    <line x1="78" y1="92" x2="78" y2="96"/>
    <line x1="96" y1="76" x2="96" y2="80"/>
    <line x1="92" y1="100" x2="92" y2="104"/>
    <line x1="50" y1="56" x2="50" y2="60"/>
    <line x1="80" y1="60" x2="80" y2="64"/>
  </g>

  <!-- tiny round ears -->
  <ellipse cx="34" cy="32" rx="6" ry="5" fill="#D4A47A" stroke="#5A3A22" stroke-width="2.6"/>
  <ellipse cx="34" cy="33" rx="2.6" ry="2" fill="#8C5E3D" opacity="0.6"/>
  <ellipse cx="92" cy="32" rx="6" ry="5" fill="#D4A47A" stroke="#5A3A22" stroke-width="2.6"/>
  <ellipse cx="92" cy="33" rx="2.6" ry="2" fill="#8C5E3D" opacity="0.6"/>

  <!-- snout -->
  <path d="M 38 60 C 38 78, 48 84, 65 84 C 82 84, 92 78, 92 60 C 92 56, 86 54, 65 54 C 44 54, 38 56, 38 60 Z" fill="#8C5E3D" stroke="#5A3A22" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- snout highlight -->
  <ellipse cx="55" cy="62" rx="14" ry="4" fill="#A87850" opacity="0.5"/>

  <!-- eyes (happy) -->
  <path d="M 41.5 48.5 Q 46 46 50.5 48.5" stroke="#5A3A22" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 79.5 48.5 Q 84 46 88.5 48.5" stroke="#5A3A22" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- nostrils -->
  <ellipse cx="58" cy="64" rx="1.6" ry="1.2" fill="#5A3A22"/>
  <ellipse cx="72" cy="64" rx="1.6" ry="1.2" fill="#5A3A22"/>

  <!-- mouth + buck teeth (happy) -->
  <path d="M58 74 Q 65 76 72 74" stroke="#5A3A22" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <rect x="61.5" y="74" width="3.5" height="6" rx="0.7" fill="#FFF5E0" stroke="#5A3A22" stroke-width="1.4"/>
  <rect x="65.5" y="74" width="3.5" height="6" rx="0.7" fill="#FFF5E0" stroke="#5A3A22" stroke-width="1.4"/>

  <!-- blush -->
  <ellipse cx="28" cy="56" rx="3.8" ry="2.6" fill="#F2A9A3" opacity="0.85"/>
  <ellipse cx="102" cy="56" rx="3.8" ry="2.6" fill="#F2A9A3" opacity="0.85"/>

  <!-- lightbulb -->
  <circle cx="20" cy="22" r="5" fill="#FFD16B" stroke="#5A3A22" stroke-width="1.8"/>
  <circle cx="18.5" cy="20.5" r="1.2" fill="#FFF6CC"/>
  <g stroke="#D89B2E" stroke-width="1.3" stroke-linecap="round">
    <line x1="13" y1="18" x2="10" y2="16"/>
    <line x1="27" y1="18" x2="30" y2="16"/>
    <line x1="20" y1="14" x2="20" y2="11"/>
  </g>

  <!-- feet -->
  <path d="M 36 116 C 32 116, 30 122, 36 124 C 46 124, 52 122, 52 118 C 50 114, 42 114, 36 116 Z" fill="#8C5E3D" stroke="#5A3A22" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 78 116 C 74 116, 72 122, 78 124 C 88 124, 94 122, 94 118 C 92 114, 84 114, 78 116 Z" fill="#8C5E3D" stroke="#5A3A22" stroke-width="2.4" stroke-linejoin="round"/>
  <g stroke="#5A3A22" stroke-width="1.4" stroke-linecap="round">
    <line x1="38" y1="120" x2="38" y2="124"/>
    <line x1="42" y1="120" x2="42" y2="124"/>
    <line x1="46" y1="120" x2="46" y2="124"/>
    <line x1="80" y1="120" x2="80" y2="124"/>
    <line x1="84" y1="120" x2="84" y2="124"/>
    <line x1="88" y1="120" x2="88" y2="124"/>
  </g>
</svg>
